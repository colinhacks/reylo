[package]
name = "reylo-engine-native"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reylo's engine as a native program per database: JSON requests on standard input, one answer per line on standard output. It answers what the WebAssembly engine answers, and opens its own connection to the database to analyze a statement to its end."

[features]
default = ["postgres", "mysql", "sqlite", "sqlserver"]
postgres = ["reylo-engine/tokio-postgres", "dep:tokio-postgres", "dep:tokio-postgres-rustls"]
mysql = ["reylo-engine/mysql_async", "dep:mysql_async"]
sqlite = ["reylo-engine/rusqlite", "dep:rusqlite"]
sqlserver = ["reylo-engine/tiberius", "dep:tiberius", "dep:tokio-util", "dep:azure_core", "dep:azure_identity", "dep:reqwest"]

[[bin]]
name = "reylo-postgres"
path = "src/bin/reylo-postgres.rs"
required-features = ["postgres"]

[[bin]]
name = "reylo-mysql"
path = "src/bin/reylo-mysql.rs"
required-features = ["mysql"]

[[bin]]
name = "reylo-sqlite"
path = "src/bin/reylo-sqlite.rs"
required-features = ["sqlite"]

[[bin]]
name = "reylo-sqlserver"
path = "src/bin/reylo-sqlserver.rs"
required-features = ["sqlserver"]

[build-dependencies]
reylo-engine-build.workspace = true

[dependencies]
reylo-engine.workspace = true
reylo-engine-core.workspace = true
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
tokio = { version = "1", features = ["rt", "io-std", "io-util", "net", "time"] }
tokio-postgres = { version = "0.7", optional = true }
tokio-postgres-rustls = { version = "0.13", optional = true }
# TLS over rustls and ring, as the Postgres program's.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "default-rustls-ring"], optional = true }
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
# TLS over rustls, with ring for its crypto as the program's every other connection.
tiberius = { workspace = true, features = ["tds73", "rustls"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
# Entra ID sign-in: a token from Microsoft's identity crate, over reqwest with no TLS provider of its
# own, so that it takes the process's, ring, as every other connection does.
azure_core = { version = "1", default-features = false, features = ["reqwest", "tokio"], optional = true }
azure_identity = { version = "1", default-features = false, features = ["tokio"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustls-platform-verifier = "0.6"

# The WebAssembly component (engine/wasip2) has no operating system's certificate store.
[target.'cfg(target_family = "wasm")'.dependencies]
webpki-roots = "1"
