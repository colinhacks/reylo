[package]
name = "reylo-engine"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reylo's analysis engine for a Rust host: each database's engine behind a feature, the replay loop that runs an analysis to its end, the answers to the engine's needs over tokio-postgres, rusqlite, mysql_async or tiberius, and the engine as a program that opens its own connections."

[features]
# None by default: a host names the databases it reads.
default = []
# Each database: its engine, the answers to its needs over its client, and its program.
postgres = ["dep:reylo-engine-postgres", "tls", "dep:tokio-postgres", "dep:tokio-postgres-rustls"]
mysql = ["dep:reylo-engine-mysql", "tls", "dep:mysql_async"]
sqlite = ["dep:reylo-engine-sqlite", "dep:rusqlite"]
# tiberius makes its own TLS connection, for which the program installs rustls's ring provider, and a
# sign-in with Microsoft Entra ID takes its token from azure_identity.
sqlserver = ["dep:reylo-engine-sqlserver", "dep:tiberius", "dep:futures-io", "dep:tokio-util", "dep:rustls", "dep:azure_core", "dep:azure_identity", "dep:reqwest"]
# TLS over rustls, for the databases a URL reaches over the network.
tls = ["dep:rustls", "dep:rustls-pki-types", "dep:rustls-platform-verifier", "dep:webpki-roots"]

[[bin]]
name = "reylo-postgres"
path = "src/bin/reylo-postgres.rs"
required-features = ["postgres"]

[[bin]]
name = "reylo-mysql"
path = "src/bin/reylo-mysql.rs"
required-features = ["mysql"]

[[bin]]
name = "reylo-sqlite"
path = "src/bin/reylo-sqlite.rs"
required-features = ["sqlite"]

[[bin]]
name = "reylo-sqlserver"
path = "src/bin/reylo-sqlserver.rs"
required-features = ["sqlserver"]

[build-dependencies]
reylo-engine-build.workspace = true

[dependencies]
reylo-engine-core.workspace = true
reylo-engine-postgres = { workspace = true, optional = true }
reylo-engine-sqlite = { workspace = true, optional = true }
reylo-engine-mysql = { workspace = true, optional = true }
reylo-engine-sqlserver = { workspace = true, optional = true }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
tokio = { version = "1", features = ["rt", "io-std", "io-util", "net", "time"] }
# `with-serde_json-1`: a `json` or `jsonb` column reads as its value, as the answers of the server-side
# extension come back.
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }
tokio-postgres-rustls = { version = "0.13", optional = true }
# TLS over rustls and ring, as the Postgres program's.
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "default-rustls-ring"], optional = true }
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
# TDS 7.3 and later (SQL Server 2008 and later), over rustls with ring for its crypto, as the
# program's every other connection.
tiberius = { workspace = true, features = ["tds73", "rustls"], optional = true }
futures-io = { version = "0.3", optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
# Entra ID sign-in: a token from Microsoft's identity crate, over reqwest with no TLS provider of its
# own, so that it takes the process's, ring, as every other connection does.
azure_core = { version = "1", default-features = false, features = ["reqwest", "tokio"], optional = true }
azure_identity = { version = "1", default-features = false, features = ["tokio"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
rustls-pki-types = { version = "1", features = ["std"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
rustls-platform-verifier = { version = "0.6", optional = true }

# The WebAssembly component (engine/wasip2) has no operating system's certificate store.
[target.'cfg(target_family = "wasm")'.dependencies]
webpki-roots = { version = "1", optional = true }
