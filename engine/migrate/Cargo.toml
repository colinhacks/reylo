[package]
name = "reylo-migrate"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reylo's migrations: hand-written SQL migrations checked against the declared schema in shadow databases before they run: on Postgres, MySQL, SQLite and SQL Server over the connections of the native engine."

[dependencies]
reylo-engine-native = { workspace = true, features = ["postgres", "mysql", "sqlite", "sqlserver"] }
# Postgres 18's parser (`reylo-pg-query`, the workspace's), which reads `schema.sql` for the text each
# object was declared with; prost's recursion limit lifted, as the Postgres engine lifts it, so a
# deeply nested declaration decodes.
pg_query.workspace = true
prost = { version = "0.13", features = ["no-recursion-limit"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
rusqlite = { version = "0.39", features = ["bundled"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
tokio = { version = "1", features = ["rt", "time"] }
tokio-postgres = "0.7"
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "default-rustls-ring"] }
tiberius = { workspace = true, features = ["tds73", "rustls"] }

[target.'cfg(unix)'.dependencies]
# The user id, which names the directory of a user's SQLite run locks.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
