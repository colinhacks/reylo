[package]
name = "reylo-migrate"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reylo's migrations: hand-written SQL migrations checked against the declared schema in shadow databases before they run: on Postgres, MySQL, SQLite (Turso's among it) and SQL Server over the connections of the native engine."

[features]
default = ["cli"]
# The commands as the `reylo` binary runs them: connections of their own (tokio-postgres, mysql_async,
# rusqlite and tiberius, through the engine's connection code), shadow databases, and the diff engine that
# writes a migration from a change to schema.sql, over Postgres's parser. Without it, deploy and
# status run on a database a host connects (`db::Session`), as a Rust app's `reylo::migrate!()` does,
# and nothing else is built.
cli = ["dep:reylo-engine", "dep:pg_query", "dep:prost", "dep:rusqlite", "dep:tokio-postgres", "dep:mysql_async", "dep:tiberius", "dep:ureq"]

[dependencies]
reylo-engine = { workspace = true, features = ["postgres", "mysql", "sqlite", "sqlserver"], optional = true }
# Postgres 18's parser (`reylo-pg-query`, the workspace's), which reads `schema.sql` for the text each
# object was declared with; prost's recursion limit lifted, as the Postgres engine lifts it, so a
# deeply nested declaration decodes.
pg_query = { workspace = true, optional = true }
prost = { version = "0.13", features = ["no-recursion-limit"], optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
tokio = { version = "1", features = ["rt", "time"] }
tokio-postgres = { version = "0.7", optional = true }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust", "default-rustls-ring"], optional = true }
tiberius = { workspace = true, features = ["tds73", "rustls"], optional = true }

# A libSQL server's database (Turso's) over HTTP, as `@libsql/client` reaches it.
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[target.'cfg(unix)'.dependencies]
# The user id, which names the directory of a user's SQLite run locks.
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
