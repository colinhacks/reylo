[package]
name = "reylo-engine-sqlserver"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reylo's analysis engine for SQL Server: the server's own description of a statement's result and parameters, narrowed by a sqlparser tree, over the core's protocol."

[lib]
name = "reylo_engine_sqlserver"

[build-dependencies]
reylo-engine-build.workspace = true

[dependencies]
reylo-engine-core.workspace = true
sqlparser = { version = "=0.63.0", default-features = false, features = ["std", "visitor"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
