# sqlparser 0.63.0 (apache/datafusion-sqlparser-rs) as crates.io published it, without its
# development and optional dependencies: the MySQL engine's copy (README.md), published under a name
# of its own, `reylo-sqlparser`, so that the engine builds from crates.io. Its library is still
# `sqlparser`.

[package]
edition = "2021"
# Written here, not taken from the workspace: the copy keeps its version across Reylo's releases, so
# its manifest moves only when the copy does, and a new workspace floor needs no new version of it.
rust-version = "1.94"
name = "reylo-sqlparser"
version = "0.63.0"
authors = ["Apache DataFusion <dev@datafusion.apache.org>"]
# The hash of this copy's sources, which the MySQL engine's fingerprint combines with its own.
build = "build.rs"
include = [
    "src/**/*.rs",
    "build.rs",
    "Cargo.toml",
    "LICENSE.TXT",
    "README.md",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The MySQL analysis engine's copy of sqlparser 0.63.0, cut to queries and DML and reading MySQL as MySQL does: a crate of Reylo's, not the Apache DataFusion project's."
homepage = "https://github.com/apache/datafusion-sqlparser-rs"
keywords = [
    "ansi",
    "sql",
    "lexer",
    "parser",
]
license = "Apache-2.0"
repository = "https://github.com/reylosql/reylo"

[features]
# Upstream's features, kept as names so the `cfg`s in the sources stay known. The engine builds
# `std` alone, and the optional dependencies behind the others are left out.
default = ["std"]
bigdecimal = []
derive-dialect = []
json_example = []
recursive-protection = ["std"]
serde = []
std = []
visitor = []

[lib]
name = "sqlparser"
path = "src/lib.rs"
# Upstream's tests are not in this copy, and its doc examples use the whole crate.
test = false
doctest = false

[dependencies.log]
version = "0.4"

[lints.rust]
unsafe_code = "forbid"
