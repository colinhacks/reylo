[package]
name = "reylo-engine-core"
version.workspace = true
edition = "2021"
publish = false
description = "What every database's analysis engine shares: the request protocol and its host, the placeholder lexer, the project file, the type model and its JSON Schema, structured parameters, the freshness facts, and the WebAssembly ABI each database's artifact exports."

[lib]
name = "reylo_engine_core"

[build-dependencies]
reylo-engine-build = { path = "../build-support" }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
serde_yaml = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
