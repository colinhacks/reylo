[package]
name = "reylo-engine"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reylo's analysis engine for a Rust host: each database's engine behind a feature, the replay loop that runs an analysis to its end, and the answers to the engine's needs over tokio-postgres, rusqlite, mysql_async or tiberius."

[features]
postgres = ["dep:reylo-engine-postgres"]
sqlite = ["dep:reylo-engine-sqlite"]
mysql = ["dep:reylo-engine-mysql"]
sqlserver = ["dep:reylo-engine-sqlserver"]
# A client the engine's needs are answered over, which brings its database's engine.
tokio-postgres = ["postgres", "dep:tokio-postgres"]
rusqlite = ["sqlite", "dep:rusqlite"]
mysql_async = ["mysql", "dep:mysql_async"]
tiberius = ["sqlserver", "dep:tiberius", "dep:futures-io"]

[dependencies]
reylo-engine-core.workspace = true
reylo-engine-postgres = { workspace = true, optional = true }
reylo-engine-sqlite = { workspace = true, optional = true }
reylo-engine-mysql = { workspace = true, optional = true }
reylo-engine-sqlserver = { workspace = true, optional = true }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
# `with-serde_json-1`: a `json` or `jsonb` column reads as its value, as the answers of the server-side
# extension come back.
tokio-postgres = { version = "0.7", optional = true, features = ["with-serde_json-1"] }
rusqlite = { version = "0.39", features = ["bundled"], optional = true }
mysql_async = { version = "0.37", default-features = false, features = ["minimal-rust"], optional = true }
# TDS 7.3 and later (SQL Server 2008 and later), and its TLS over rustls, which the program gives the
# crypto provider every other connection of it uses.
tiberius = { workspace = true, features = ["tds73", "rustls"], optional = true }
futures-io = { version = "0.3", optional = true }
