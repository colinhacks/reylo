[package]
name = "reylo-engine-clickhouse"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reylo's analysis engine for ClickHouse: the server's own description of a statement's result, its nullability and nested shapes included, and its query tree, over the core's protocol."

[lib]
name = "reylo_engine_clickhouse"

[build-dependencies]
reylo-engine-build.workspace = true

[dependencies]
reylo-engine-core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
