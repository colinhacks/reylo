[package]
name = "reylo-engine-postgres"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Reylo's analysis engine for Postgres: Postgres's parse tree, the type registry, the expression rules, the row-count proof, the nested JSON shapes and the handshake with a server-side extension, over the core's protocol."

[lib]
name = "reylo_engine_postgres"

[build-dependencies]
reylo-engine-build.workspace = true

[dependencies]
reylo-engine-core.workspace = true
syntax.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "unbounded_depth"] }
