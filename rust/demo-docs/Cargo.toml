[package]
name = "demo-docs"
version = "0.0.0"
edition = "2021"
publish = false

# Its statements are typed against the demo's database as it compiles, so a build of the workspace
# leaves it out: `cargo run -p demo-docs --features live` builds and runs it, as
# .github/scripts/rust-demos.sh does in CI.
[features]
live = []

[[bin]]
name = "demo-docs"
path = "src/main.rs"
required-features = ["live"]

# Every Rust snippet the docs site shows, compiled against the schema of its examples, with the types
# the page names for each value written out, and run.
[dependencies]
reylo = { package = "reylo-sqlx", path = "../reylo", features = ["chrono", "uuid"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
