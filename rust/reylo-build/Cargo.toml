[package]
name = "reylo-build"
version.workspace = true
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Writes the modules of reylo generate rust-sqlx from a build script, into Cargo's OUT_DIR: each .sql file's Query, Row and run on sqlx, typed by Reylo's engine."

[dependencies]
reylo-codegen = { workspace = true, features = ["generate"] }
