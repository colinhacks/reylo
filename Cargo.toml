# One Cargo workspace over the engine (`engine/`: `reylo-engine-core`, what every database shares;
# `reylo-engine-postgres`, `reylo-engine-sqlite` and `reylo-engine-mysql`, one per database;
# `reylo-engine-build`, their build scripts' source hash; `reylo-engine`, the facade a Rust host links;
# and `reylo-engine-native`, the program each database's WebAssembly component is built from) and the
# soundness oracle (`oracle/`). One lockfile, one `target/`. The component crate, `engine/wasip2`, is
# a workspace of its own (its Cargo.toml says why).
#
# The `[patch]` is the Postgres crate's: `pg_query` 18.0.0, the Postgres 18 parser, with the patch
# from `engine/postgres/vendor/` applied by `engine/build.sh --prepare`, which also fetches the SQLite
# amalgamation `engine/sqlite/build.rs` compiles. Run it once before any cargo command here.
#
# `engine/mysql/vendor/sqlparser`, the MySQL crate's own copy of `sqlparser`, is a member as every
# path dependency under this directory is, with no tests of its own.
[workspace]
resolver = "2"
members = [
  "engine/build-support",
  "engine/core",
  "engine/facade",
  "engine/native",
  "engine/postgres",
  "engine/sqlite",
  "engine/mysql",
  "oracle",
]

[patch.crates-io]
pg_query = { path = "engine/postgres/.patched/pg_query" }

[profile.release]
# 3 rather than "s": 7 µs less CPU on a 50-row read (71 against 78 with the other fixes), for a
# Reylo Framework binary 31 % larger (20.3 to 26.6 MB stripped, measured 2026-10-03). The engine's wasm
# stays "s" and without LTO: engine/build.sh sets CARGO_PROFILE_RELEASE_OPT_LEVEL and _LTO for its own
# build.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
# libpg_query is large; keep dev builds tolerable.
debug = 1
