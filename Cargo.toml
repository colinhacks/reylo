# One Cargo workspace over the engine (`engine/`: `reylo-engine-core`, what every database shares;
# `reylo-engine-postgres`, `reylo-engine-sqlite` and `reylo-engine-mysql`, one per
# database; `reylo-engine-build`, their build scripts' source hash; `reylo-engine`, what a Rust host
# links, each database's engine with its client, and the program that connects it to its database
# (`engine/native`); and `reylo-cli`, the `reylo` binary that serves them all, `engine/cli`), the Rust
# crate and its macro (`rust/`) and the soundness oracle (`oracle/`). One lockfile, one `target/`.
# The component crate, `engine/wasip2`, is a workspace of its own (its Cargo.toml says why).
#
# Every crate a Rust project builds from crates.io carries what it compiles, so none needs a step of
# this repository's: `reylo-engine-syntax`, the Postgres parser generated from Postgres's own grammar
# (`engine/syntax`, whose generated files are committed); `reylo-sqlparser`, the MySQL crate's copy of `sqlparser` (`engine/mysql/vendor/sqlparser`); and
# the SQLite amalgamation the prepare step patches into `engine/sqlite/.sqlite/`, which
# `reylo-engine-sqlite` packages. Run the prepare step once before any cargo command here.
[workspace]
resolver = "2"
members = [
  "engine/build-support",
  "engine/core",
  "engine/syntax",
  "engine/native",
  "engine/migrate",
  "engine/cli",
  "engine/postgres",
  "engine/sqlite",
  "engine/mysql",
  "oracle",
  "rust/reylo",
  "rust/reylo-macros",
  "rust/reylo-build",
  "rust/demo-reylo",
  "rust/demo-sqlite",
  "rust/demo-mysql",
  "rust/demo-docs",
  "rust/demo-codegen",
]

# reylo's version, which the engine reports on ping and the npm package `reylo` must equal, and every
# crate published from here takes.
[workspace.package]
version = "0.8.1"
# The oldest Rust every published crate builds with, set by sqlx 0.9's own: the package check
# (.github/scripts/rust-package-check.sh) builds its projects from the packed crates on it, while
# this workspace builds on the newer release rust-toolchain.toml pins. The parser copies write theirs
# in their own manifests.
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/reylosql/reylo"
homepage = "https://reylo.dev"

# The crates of this workspace, each by path and by the version crates.io knows it at. The two copies
# of upstream crates keep their own versions, which change only with what they copy.
[workspace.dependencies]
reylo-engine-build = { path = "engine/build-support", version = "=0.8.1" }
reylo-engine-core = { path = "engine/core", version = "=0.8.1" }
reylo-engine-postgres = { path = "engine/postgres", version = "=0.8.1" }
reylo-engine-sqlite = { path = "engine/sqlite", version = "=0.8.1" }
reylo-engine-mysql = { path = "engine/mysql", version = "=0.8.1" }
reylo-engine = { path = "engine/native", version = "=0.8.1", default-features = false }
reylo-migrate = { path = "engine/migrate", version = "=0.8.1", default-features = false }
reylo-macros = { path = "rust/reylo-macros", version = "=0.8.1" }
reylo = { path = "rust/reylo", version = "=0.8.1", default-features = false }
reylo-build = { path = "rust/reylo-build", version = "=0.8.1", default-features = false }
syntax = { package = "reylo-engine-syntax", path = "engine/syntax", version = "=0.8.1" }
sqlparser = { package = "reylo-sqlparser", path = "engine/mysql/vendor/sqlparser", version = "=0.63.0", default-features = false }

[profile.release]
# 3 rather than "s": 7 µs less CPU on a 50-row read (71 against 78 with the other fixes), for a
# binary that links the engine 31 % larger (20.3 to 26.6 MB stripped, measured 2026-10-03). The
# playground's component stays "s" and without LTO, by the profile of its own workspace
# (engine/wasip2/Cargo.toml).
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = 1
