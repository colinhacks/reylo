# .github/workflows/test.yml

name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # release.yml runs this same job before it stages anything, so the gate a release passes is the one every push passes
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    # This file lives in the private working repository too, which `scripts/publish/publish.ts` copies it from; CI runs in the public one only.
    if: ${{ !github.event.repository.private }}
    name: Typecheck, test and build on Node 24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Throwaway servers for the tests that run statements, on ports clear of the defaults: the loader's tests skip each database whose URL is unset, and this job fails on any skip.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    env:
      REYLO_TEST_PG: postgres://postgres@127.0.0.1:55432/postgres
      REYLO_TEST_MYSQL: mysql://root@127.0.0.1:53306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nubjs/setup-nub@c7b970ec04655a2f0a111cd436cc182a3b660e7a # v0.6.0
        with:
          nub-version: "0.9.6"
          node-version: "24"
      - run: nub install --frozen-lockfile
      # The drivers the live tests load, and the Jest and Vitest projects the transformer's tests run.
      - run: nub install --frozen-lockfile
        working-directory: lab/drivers
      - run: nub install --frozen-lockfile
        working-directory: lab/jest
      # Each lab reaches the package and its database's engine through links into this checkout, and its driver through lab/drivers (scripts/gates.sh, link_lab); nub install replaces node_modules, so the links come after it.
      - name: Link the labs the tests load
        run: |
          link_lab () {
            local dir="lab/$1" db="$2"
            shift 2
            mkdir -p "$dir/node_modules/@reylosql"
            ln -sfn ../../.. "$dir/node_modules/reylo"
            ln -sfn "../../../../packages/$db" "$dir/node_modules/@reylosql/$db"
            for driver in "$@"; do ln -sfn "../../drivers/node_modules/$driver" "$dir/node_modules/$driver"; done
          }
          link_lab basic postgres postgres
          link_lab mysql mysql mysql2
          link_lab jest sqlite
      - run: nub run typecheck
      - name: Run the tests, none skipped
        run: |
          set -o pipefail
          nub run test 2>&1 | tee "$RUNNER_TEMP/test.log"
          grep -q '^ℹ skipped 0$' "$RUNNER_TEMP/test.log" || { echo "::error::a test was skipped"; exit 1; }
      - run: nub run build

  # The engine's sources, which the job above only meets as the committed packages/<database>/engine.wasm
  # (tests/fingerprint.test.ts checks each is their build): built natively, with no warning, and their tests run.
  engine:
    if: ${{ !github.event.repository.private }}
    name: Build and test the engine
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The patched pg_query copy the workspace's [patch] points at and the SQLite amalgamation: cargo resolves nothing without them.
      - run: engine/build.sh --prepare
      - name: Build the workspace, with no warning
        run: |
          set -o pipefail
          cargo build --workspace --all-targets 2>&1 | tee "$RUNNER_TEMP/build.log"
          ! grep -E '^warning' "$RUNNER_TEMP/build.log"
      - run: cargo test -p reylo-engine-core -p reylo-engine-postgres -p reylo-engine-sqlite -p reylo-engine-mysql -p reylo-oracle

  # The soundness oracle (oracle/): every statement of oracle/cases is analyzed by the engine's sources and
  # run on live servers over seeded edge values, and a value that contradicts its inferred type or row count
  # fails the case. Postgres 18 runs on the runner rather than in a container, because the json_schema_*
  # cases call five validator extensions built into it.
  oracle:
    if: ${{ !github.event.repository.private }}
    name: Soundness oracle on Postgres 18 and MySQL 8.4
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 60
    env:
      PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install Postgres 18
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-18 postgresql-server-dev-18
      # The validators take about a quarter of an hour to build, so their staged files are cached, and saved
      # as soon as they are built rather than only when the job passes.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: validators
        with:
          path: ~/json-schema-validators
          key: json-schema-validators-${{ runner.os }}-pg18-${{ hashFiles('.github/scripts/json-schema-validators.sh') }}
      - name: Build the JSON Schema validators
        if: steps.validators.outputs.cache-hit != 'true'
        run: sh .github/scripts/json-schema-validators.sh ~/json-schema-validators "$RUNNER_TEMP/validators" "$PG_BIN/pg_config"
      - if: steps.validators.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/json-schema-validators
          key: ${{ steps.validators.outputs.cache-primary-key }}
      - name: Install the validators and start Postgres 18
        run: |
          sudo cp -R ~/json-schema-validators/. /
          "$PG_BIN/initdb" -D "$RUNNER_TEMP/pg" -U postgres --auth=trust --no-sync -E UTF8 --locale=C
          "$PG_BIN/pg_ctl" -D "$RUNNER_TEMP/pg" -o "-p 55432 -c listen_addresses=localhost -c unix_socket_directories=$RUNNER_TEMP" -l "$RUNNER_TEMP/postgres.log" -w start
      - run: engine/build.sh --prepare
      - name: Run the oracle
        run: cargo run -q -p reylo-oracle -- --url postgres://postgres@localhost:55432/postgres --mysql-url mysql://root@127.0.0.1:53306 --strict-coverage oracle/cases
